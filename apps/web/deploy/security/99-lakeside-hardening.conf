# Lakeside host hardening — sshd drop-in (EU + US VPS).
#
# Installed to /etc/ssh/sshd_config.d/99-lakeside-hardening.conf by
# deploy/security/harden-host.sh.
#
# Ubuntu includes sshd_config.d/*.conf before the rest of sshd_config and sshd
# uses the FIRST value it sees for each keyword, so these win over the distro
# defaults. Re-applying is idempotent; `sshd -t` must pass before any reload.
#
# Both hosts already had key-only auth and no root password login. This closes
# the remaining gaps: X11/agent forwarding (an agent-forwarded socket is a
# usable credential if the host is ever compromised), loose auth-attempt limits,
# and stale half-open sessions.

PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
GatewayPorts no

MaxAuthTries 4
MaxSessions 10
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
UseDNS no
