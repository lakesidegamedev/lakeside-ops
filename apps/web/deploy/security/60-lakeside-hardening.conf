# Lakeside host hardening — kernel/network sysctl baseline.
#
# Installed to /etc/sysctl.d/60-lakeside-hardening.conf by
# deploy/security/harden-host.sh, then applied with `sysctl --system`.
#
# Deliberately narrow: both hosts are Ubuntu (24.04 / 26.04) whose defaults
# already cover syncookies, redirects, source routing and hardlink protection.
# Only the deltas that actually matter are set here, so a future base-image
# change is not silently overridden.
#
# NOT set on purpose: net.ipv4.conf.all.rp_filter. Both hosts run 7-8 Docker
# bridge networks; strict (1) reverse-path filtering breaks multi-homed
# container traffic. The Ubuntu default of 2 (loose) is the correct value here.

# Do not let setuid processes dump core into a readable location.
fs.suid_dumpable = 0

# Never emit ICMP redirects: neither host routes for anyone.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Hide kernel pointers from unprivileged readers.
kernel.kptr_restrict = 2

# Restrict kernel log access to root.
kernel.dmesg_restrict = 1

# Restrict ptrace to descendants (root retains CAP_SYS_PTRACE).
kernel.yama.ptrace_scope = 1

# Refuse to follow symlinks/hardlinks in world-writable sticky directories.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# SYN flood resilience (syncookies should already be on; assert it).
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 4096
