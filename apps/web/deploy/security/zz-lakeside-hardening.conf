# Lakeside host hardening — fail2ban jails (EU + US VPS)
#
# Installed to /etc/fail2ban/jail.d/20-lakeside-hardening.conf by
# deploy/security/harden-host.sh. Safe to re-apply (idempotent).
#
# Rationale: both hosts take thousands of SSH credential-stuffing attempts per
# day. Default Debian settings (10m ban / 5 retries) let a distributed attacker
# rotate IPs indefinitely. This bans on the 3rd failure, for an hour, doubling
# per repeat offence up to four weeks, and records repeat offenders.

[DEFAULT]
# Never lock out the peer box or the loopback. The EU box is the console host
# and reaches the US box over SSH; banning it would blind the dashboard.
ignoreip   = 127.0.0.1/8 ::1 167.86.68.67 13.140.231.229
bantime    = 1h
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 4w
findtime   = 10m
maxretry   = 4
backend    = systemd
banaction  = nftables
banaction_allports = nftables[type=allports]

[sshd]
enabled  = true
mode     = aggressive
maxretry = 3
findtime = 10m
bantime  = 1h
# Both hosts run the unit as ssh.service (Ubuntu 24.04 and 26.04). Without an
# explicit match the filter defaults to sshd.service and the jail silently
# never sees a failure — verified on contabo-vps12-us 2026-10-23.
journalmatch = _SYSTEMD_UNIT=ssh.service + _COMM=sshd

# Repeat offenders: anyone banned 3+ times in a day gets four weeks.
[recidive]
enabled   = true
logpath   = /var/log/fail2ban.log
backend   = auto
banaction = nftables[type=allports]
bantime   = 4w
findtime  = 1d
maxretry  = 3

# Caddy fronts every public site on both boxes; keep a jail ready for auth
# failures in the reverse-proxied admin surfaces (:8090 basicauth on the EU
# box) without banning Cloudflare's shared egress.
[caddy-auth]
enabled   = false
port      = http,https
filter    = apache-auth
logpath   = /var/log/caddy/access.log
maxretry  = 10
findtime  = 10m
bantime   = 1h
