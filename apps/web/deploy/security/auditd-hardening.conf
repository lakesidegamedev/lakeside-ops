# Lakeside host hardening — auditd retention/behaviour overrides.
#
# Installed to /etc/audit/auditd.conf.d/ is not supported upstream, so
# harden-host.sh appends these values to /etc/audit/auditd.conf idempotently
# (keyed on the marker below). Shipped here as the source of truth.
#
# [lakeside-hardening]
# Never suspend auditing because the disk filled: a suspended auditd is a blind
# spot an attacker can trigger deliberately. Log loudly instead.
# max_log_file = 200
# num_logs = 10
# space_left = 2048
# space_left_action = SYSLOG
# admin_space_left = 1024
# admin_space_left_action = SYSLOG
# disk_full_action = SYSLOG
# disk_error_action = SYSLOG
