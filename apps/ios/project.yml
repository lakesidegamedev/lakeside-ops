name: LakesideOps
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw.git
    exactVersion: 0.29.0
  LakesideCore:
    path: Core
settings:
  base:
    OPS_SERVER_URL: https://ops.lakesidegames.net
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
targets:
  LakesideOps:
    type: application
    platform: iOS
    sources: [Shared, Ops, ActivityShared, Resources]
    dependencies:
      - package: LakesideCore
      - package: SwiftDraw
      - target: KeirWidgets
    info:
      path: Generated/Ops-Info.plist
      properties:
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: net.lakesidegames.ops
            CFBundleURLSchemes: [lakesideops]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.ops
        MARKETING_VERSION: '2.4.1'
        INFOPLIST_KEY_LakesideOpsServerURL: "$(OPS_SERVER_URL)"
        INFOPLIST_KEY_CFBundleDisplayName: Lakeside Ops
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Talk to Keir using your microphone.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn your speech into messages for Keir. Recognition runs on your device when available; otherwise Apple processes the audio.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": scripts/simulator.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": scripts/ops.entitlements
  KeirWidgets:
    type: app-extension
    platform: iOS
    sources: [KeirWidgets, ActivityShared, Ops/KeirSprite.swift, Shared/KeirWidgetCache.swift, Resources/KeirSprites]
    info:
      path: Generated/Widgets-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.ops.widgets
        MARKETING_VERSION: '2.4.1'
        INFOPLIST_KEY_CFBundleDisplayName: Keir
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  OpsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LakesideOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.ops.uitests
        TEST_TARGET_NAME: LakesideOps
  OpsSessionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SessionTests]
    dependencies:
      - target: LakesideOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.ops.sessiontests
schemes:
  LakesideOps:
    build:
      targets:
        LakesideOps: all
    test:
      targets: [OpsUITests, OpsSessionTests]
