name: Lakeside Ops iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed archive and upload it to TestFlight
        type: boolean
        default: false
      skip_simulator:
        description: Skip simulator tests (only for code that already passed them)
        type: boolean
        default: false
      test_scope:
        description: Full suite, computer controls, or connection and remaining approval regression
        type: choice
        options: [full, computer, connection, metrics]
        default: full

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide once whether this run touches the paths the gated jobs test. A job
  # skipped by its condition still satisfies a required check, so pull requests
  # that cannot affect it stop paying for it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! changed=$(git diff --no-renames --name-only HEAD^1 HEAD); then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -qE '^(apps/ios/|\.github/workflows/ios\.yml$)' <<< "$changed"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  simulator:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_simulator) }}
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Test shared protocols
        run: swift test --package-path Core
      - name: Generate project and icons
        run: |
          swift scripts/icons.swift
          xcodegen generate
      - name: Build and test on iPhone simulator
        env:
          OPS_TEST_SCOPE: ${{ inputs.test_scope || 'full' }}
        run: bash scripts/simulator.sh LakesideOps
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d build/LakesideOps.xcresult ]; then
            xcrun xcresulttool export attachments --path build/LakesideOps.xcresult --output-path build/LakesideOps-screenshots
          fi
      - name: Save screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LakesideOps-simulator
          path: |
            apps/ios/build/LakesideOps.xcresult
            apps/ios/build/LakesideOps-screenshots
          if-no-files-found: warn

  testflight:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.release && (needs.simulator.result == 'success' || needs.simulator.result == 'skipped') }}
    needs: simulator
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project and icons
        run: |
          swift scripts/icons.swift
          xcodegen generate
      # Signing output is filtered by scripts/private-apple-command.py: no
      # identities, team or key material reach the public log.
      - name: Build, sign and upload
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: bash scripts/release.sh
      - name: Save crash symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LakesideOps-release-symbols
          path: apps/ios/build/LakesideOps.xcarchive/dSYMs
          if-no-files-found: ignore
      - name: Save release status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-status
          path: apps/ios/build/release-status.json
          if-no-files-found: warn
      - name: Remove temporary Apple key
        if: always()
        run: rm -f "$RUNNER_TEMP/lakeside-signing.p8"
