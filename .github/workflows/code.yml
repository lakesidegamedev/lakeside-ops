name: Lakeside Code
on:
  # No trigger path filter: cli and windows are required checks, and a workflow
  # that never starts leaves them pending. The changes job skips them instead.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Decide once whether this run touches the paths the gated jobs test. A job
  # skipped by its condition still satisfies a required check, so pull requests
  # that cannot affect it stop paying for it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! changed=$(git diff --no-renames --name-only HEAD^1 HEAD); then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -qE '^(apps/agent/skills/|apps/cli/|bin/lakeside\.js$|package(-lock)?\.json$|\.github/workflows/code\.yml$)' <<< "$changed"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  cli:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cli/package-lock.json
      - run: npm --prefix apps/cli ci --no-audit --no-fund
      - run: npm --prefix apps/cli run typecheck:contracts
      - run: npm run test:cli
      - name: Pack and install independently of the checkout
        working-directory: apps/cli
        run: |
          # The package file name follows package.json, so a version bump needs no workflow edit.
          tgz="$RUNNER_TEMP/$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          echo "CODE_TGZ=$tgz" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/code-install" "$tgz" --no-audit --no-fund
          "$RUNNER_TEMP/code-install/node_modules/.bin/lakeside" code --version
          "$RUNNER_TEMP/code-install/node_modules/.bin/lakeside" code doctor
      - name: Check installed engine and coordination tools
        run: node apps/cli/smoke.mjs
        env:
          LAKESIDE_CODE_PACKAGE_ROOT: ${{ runner.temp }}/code-install/node_modules/@lakesidegamedev/code
      - name: Check installed terminal in a real PTY
        run: python3 apps/cli/tui-smoke.py
        env:
          LAKESIDE_CODE_PACKAGE_ROOT: ${{ runner.temp }}/code-install/node_modules/@lakesidegamedev/code
      - name: Bundle Windows prototype installers
        run: python3 apps/cli/package-windows.py --package "$CODE_TGZ" --output "$RUNNER_TEMP/Lakeside-Code-Windows-Prototype.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: lakeside-code
          path: |
            ${{ env.CODE_TGZ }}
            ${{ runner.temp }}/Lakeside-Code-Windows-Prototype.zip
          if-no-files-found: error
  windows:
    needs: cli
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CLI test dependencies
        run: npm --prefix apps/cli ci --no-audit --no-fund
      - name: Run CLI tests on native Windows
        run: npm run test:cli
      - uses: actions/download-artifact@v4
        with:
          name: lakeside-code
          path: ${{ runner.temp }}/code-artifact
      - name: Use a private npm installation prefix
        shell: powershell
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'Lakeside Global'
          "NPM_CONFIG_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the Windows ZIP with Windows PowerShell
        shell: powershell
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'code-artifact/Lakeside-Code-Windows-Prototype.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'Lakeside Prototype'
          Expand-Archive -LiteralPath $bundle -DestinationPath $destination
          & (Join-Path $destination 'Install-LakesideCode.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows installation failed' }
          & (Join-Path $env:NPM_CONFIG_PREFIX 'lakeside.cmd') --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed command failed' }
      - name: Check native engine, Keir skills and coordination tools
        shell: powershell
        run: |
          $env:LAKESIDE_CODE_PACKAGE_ROOT = Join-Path $env:NPM_CONFIG_PREFIX 'node_modules/@lakesidegamedev/code'
          node apps/cli/smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows runtime check failed' }
      - name: Check native Windows terminal through ConPTY
        shell: powershell
        run: |
          $env:LAKESIDE_CODE_PACKAGE_ROOT = Join-Path $env:NPM_CONFIG_PREFIX 'node_modules/@lakesidegamedev/code'
          $env:LAKESIDE_CODE_PTY_ROOT = Join-Path $env:RUNNER_TEMP 'pty-check'
          npm.cmd install --prefix $env:LAKESIDE_CODE_PTY_ROOT node-pty@1.1.0 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the CI console test dependency' }
          node apps/cli/tui-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows terminal check failed' }
